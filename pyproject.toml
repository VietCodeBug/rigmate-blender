[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rigmate"
version = "0.1.0"
description = "Trợ lý Blender mã nguồn mở hỗ trợ kiểm tra và tinh chỉnh rig nhân vật (Hunyuan 3D, Meshy) hướng tới xuất Godot."
readme = "README.md"
authors = [{ name = "RigMate Contributors" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
bridge = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
